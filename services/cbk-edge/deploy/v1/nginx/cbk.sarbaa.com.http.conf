# cbk.sarbaa.com — stage 1 of the two-stage TLS bring-up.
#
# Install to /etc/nginx/sites-available/cbk.sarbaa.com and symlink it into
# sites-enabled, then run `sudo nginx -t && sudo systemctl reload nginx`.
#
# This file is plain HTTP on purpose: Certbot cannot complete the http-01
# challenge while nginx expects a certificate it does not have yet, so no
# certificate path appears here. After Certbot issues the certificate, follow
# stage 2 in services/cbk-edge/deploy/v1/README.md and swap in the rendered
# https template.

server {
    listen 80;
    listen [::]:80;
    server_name cbk.sarbaa.com;

    server_tokens off;
    client_max_body_size 128k;

    # ACME challenges must keep working on port 80 while the certificate is
    # issued and renewed.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_buffering on;
        proxy_request_buffering on;
    }
}
